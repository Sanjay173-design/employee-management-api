services:
  redis:
    image: redis:latest
    ports:
      - "6379:6379"

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis

  celery:
    build: .
    command: celery -A app.tasks.email_tasks worker --pool=solo --loglevel=info
    env_file:
      - .env
    depends_on:
      - redis
